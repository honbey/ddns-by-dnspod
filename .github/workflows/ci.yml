name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v7
        with:
          # Same major as backend/Dockerfile.
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        env:
          # The lockfile points at a mainland mirror; use the public registry here.
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          NPM_CONFIG_REPLACE_REGISTRY_HOST: always
        run: npm ci

      # Before the build: prebuild would regenerate and hide the drift.
      - name: API types match the contract
        working-directory: frontend
        run: |
          npm run types
          git diff --exit-code -- src/api-types.gen.ts

      - name: Lint and formatting
        working-directory: frontend
        run: |
          npm run lint
          npm run format:check

      # The Go tests need the SPA embedded in the binary.
      - name: The version is written once
        run: |
          spec=$(sed -n 's/^[[:space:]]*version: *"\([^"]*\)".*/\1/p' backend/openapi.yml)
          pkg=$(node -p "require('./frontend/package.json').version")
          echo "openapi.yml=$spec package.json=$pkg"
          test "$spec" = "$pkg"

      # Dev and demo scripts live outside the frontend lint scope.
      - name: Scripts parse
        run: |
          for file in scripts/*.mjs; do
            node --check "$file"
          done

      - name: Build the SPA
        working-directory: frontend
        run: npm run build

      - name: Go static checks
        working-directory: backend
        run: |
          gofmt -l . | tee /tmp/gofmt.out
          test ! -s /tmp/gofmt.out
          go vet ./...

      - name: Go tests (race detector)
        working-directory: backend
        run: go test -race ./...

      - name: Coverage floor
        working-directory: backend
        run: |
          set -euo pipefail
          # A floor is not a target: it is a few points under what the suite
          # reaches today, so a test file that stopped running or a package that
          # lost its cases fails the build instead of passing quietly.
          check() {
            pkg="$1"
            floor="$2"
            # Split so a failing go test is reported as itself: piped straight
            # into sed, its exit status would be sed's.
            out=$(go test -cover "$pkg") || {
              echo "::error::$pkg: go test failed"
              exit 1
            }
            got=$(printf '%s\n' "$out" | sed -n 's/.*coverage: \([0-9.]*\)%.*/\1/p')
            echo "$pkg: ${got}% (floor ${floor}%)"
            awk -v g="$got" -v f="$floor" 'BEGIN { exit !(g + 0 >= f + 0) }' || {
              echo "::error::$pkg coverage fell to ${got}%, floor is ${floor}%"
              exit 1
            }
          }
          check ./internal/api/ 60
          check ./internal/acme/ 55
          check ./internal/model/ 52

      - name: Frontend type check and unit tests
        working-directory: frontend
        run: |
          npx tsc -b
          npm test

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (real sign-in flow)
        working-directory: frontend
        run: npm run test:e2e

      - name: Go end-to-end tests (real binary)
        working-directory: backend
        run: go test -count=1 -tags=e2e ./e2e/ -v

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the container image
        run: docker build -f backend/Dockerfile -t ddns-by-dnspod:ci .

      # compose declares OIDC_ISSUER and OIDC_CLIENT_ID as required.
      - name: Validate the compose file
        env:
          OIDC_ISSUER: https://auth.example.com
          OIDC_CLIENT_ID: ci
        run: docker compose config --quiet
