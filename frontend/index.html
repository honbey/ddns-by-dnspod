<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon_light.svg"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>DDNS by DNSPod</title>
    <meta name="title" content="DDNS by DNSPod" />
    <meta
      name="description"
      content="Keeps DNSPod records pointed at whatever address this host has."
    />
    <meta name="robots" content="noindex" />

    <!-- Fonts are bundled (src/styles/fonts.css): nothing loads from a third
         party, which is what lets the content policy stay at 'self'. -->

    <meta name="theme-color" content="#fff" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
