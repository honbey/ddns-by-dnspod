services:
  ddns-by-dnspod:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ddns-by-dnspod
    restart: unless-stopped
    # The container runs as root, which a rootless runtime (podman) maps to
    # whoever started it: both directories are writable without a chown on the
    # host, and the certificates are readable by their other containers.
    volumes:
      # Database and encryption key persistence
      - ./data:/data
      # Issued certificates, in the layout certbot uses. The TLS application
      # that consumes them mounts the same host directory, which is what makes
      # a renewal reach it without anyone copying files around.
      - ./certs:/certs
    # Every setting is an environment variable here; no env_file is read, so a
    # variable reaches the container only if it is listed below. Compose fills
    # the ${...} from the shell or from a .env file beside this one, which is
    # where the real credentials belong: this file is the shape, not the values.
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      # Imported on the first start to create the default account, and the ntfy
      # channel when the topic is set.
      - TENCENTCLOUD_SECRET_ID=${TENCENTCLOUD_SECRET_ID:-}
      - TENCENTCLOUD_SECRET_KEY=${TENCENTCLOUD_SECRET_KEY:-}
      - NTFY_SERVER=${NTFY_SERVER:-https://ntfy.sh}
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      - NTFY_USER=${NTFY_USER:-}
      - NTFY_PASS=${NTFY_PASS:-}
      # Protects the stored credentials. Left empty, a key is generated into
      # /data/secret.key and has to be backed up with the database.
      - DDNS_CRYPTO_KEY=${DDNS_CRYPTO_KEY:-}
      # Everything the SPA is told at run time; the image itself stays generic.
      # These names are bare rather than DDNS_ prefixed, because the browser reads
      # the same words. Only the keys without a usable default appear here:
      # app_name, api_base_url, scope, redirect_path and disabled fall back to
      # the built-in ones.
      # OIDC_ISSUER and OIDC_CLIENT_ID drive the backend's token check as well,
      # so the browser and the server cannot disagree about the tenant.
      - OIDC_ISSUER=${OIDC_ISSUER:?set OIDC_ISSUER to your provider, a placeholder default would only start a service that cannot verify a single token}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID to the client you registered with that provider}
      - OIDC_PROVIDER_NAME=${OIDC_PROVIDER_NAME:-OIDC}
      # Empty hides the "sign out everywhere" entry
      - "OIDC_LOGOUT_URL=${OIDC_LOGOUT_URL:-}"
    # No host port mapped; only the reverse-proxy network, fronted by nginx + Authelia
    expose:
      - "8080"
    networks:
      - proxy

# External network shared with nginx/Authelia
# Create it first: docker network create proxy
networks:
  proxy:
    external: true
